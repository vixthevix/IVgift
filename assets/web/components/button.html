
<!-- Preload pressed image -->
<img src="{{VAR:pressed;"img/error.png"}}" style="display: none;">

<input type="image" src="{{VAR:normal;"img/error.png"}}" 
       onMouseOver="this.src='{{VAR:pressed;"img/error.png"}}'" 
       onMouseOut="this.src='{{VAR:normal;"img/error.png"}}'"
       width="{{VAR:width;"256"}}"
       height="{{VAR:height;"256"}}"
       title="{{VAR:tooltip;" "}}">
